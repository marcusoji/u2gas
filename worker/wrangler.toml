# U2GAS — Cloudflare Worker configuration
#
# Placeholders marked YOUR-DOMAIN and YOUR-KV-ID must be replaced before the
# first deploy. Nothing secret belongs in this file: secrets are set in the
# Cloudflare dashboard under Settings → Variables and Secrets.

name = "u2gas-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Source maps are uploaded to Cloudflare for stack traces in the dashboard.
# They are not served to browsers. (Part 37)
upload_source_maps = true

[observability]
enabled = true

# --- Rate limiting -----------------------------------------------------------
# Durable Object backed, so the count is correct across colos. An in-memory
# counter resets whenever the isolate recycles and enforces nothing.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

# new_sqlite_classes is the current storage model for new Durable Objects.
# new_classes is the legacy key-value backend. (Part 26)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# --- Caching -----------------------------------------------------------------
# Catalogue and gas rate only. Availability is never cached; it is read live
# inside the reservation transaction.
[[kv_namespaces]]
binding = "CACHE"
id = "YOUR-KV-ID"

# --- Public configuration ----------------------------------------------------
# These are visible in the dashboard and in this file. Nothing here is secret.
[vars]
ENVIRONMENT = "development"
APP_ORIGIN = "http://127.0.0.1:5173"
DEPOT_ID = "00000000-0000-0000-0000-00000000d001"
PAYSTACK_CALLBACK_PATH = "/orders/verify"
MAIL_FROM = "U2 Oil and Gas <no-reply@YOUR-DOMAIN>"

[env.production]
routes = [
  { pattern = "api.YOUR-DOMAIN/*", zone_name = "YOUR-DOMAIN" }
]

[env.production.vars]
ENVIRONMENT = "production"
APP_ORIGIN = "https://YOUR-DOMAIN"
DEPOT_ID = "00000000-0000-0000-0000-00000000d001"
PAYSTACK_CALLBACK_PATH = "/orders/verify"
MAIL_FROM = "U2 Oil and Gas <no-reply@YOUR-DOMAIN>"

[[env.production.durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[env.production.kv_namespaces]]
binding = "CACHE"
id = "YOUR-PRODUCTION-KV-ID"

# --- Secrets -----------------------------------------------------------------
# Set in the Cloudflare dashboard, never here and never in git:
#
#   SUPABASE_SECRET_KEY        sb_secret_...     Supabase → API Keys
#   SUPABASE_PUBLISHABLE_KEY   sb_publishable_... Supabase → API Keys
#   PAYSTACK_SECRET_KEY        sk_...            Paystack → Settings → API Keys
#   PAYSTACK_PUBLIC_KEY        pk_...            Paystack → Settings → API Keys
#   RESEND_API_KEY             re_...            Resend → API Keys
#   QR_SIGNING_KEY             64 random hex chars, generated by you
#
# SUPABASE_URL is public but is set alongside them for convenience.
# SUPABASE_JWT_SECRET is only needed on legacy projects still signing HS256.
